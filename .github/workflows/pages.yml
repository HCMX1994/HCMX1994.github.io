name: Publish website and preserve statistics
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site builder
        run: python -m pip install -r scripts/requirements-site.txt
      - name: Validate Scholar updater
        run: python scripts/test_update_scholar.py
      - name: Validate WoS daily snapshot
        run: python scripts/test_update_wos.py
      - name: Validate visitor backup and totals
        run: |
          python scripts/test_sync_umami.py
          python scripts/test_visitor_live.py
          node scripts/test_visitor_map.cjs
      - name: Back up lifetime Umami aggregates
        id: visitors
        continue-on-error: true
        run: python scripts/sync_umami.py --url https://homepage-umami.vercel.app/api/homepage-summary --website-id d8c1f3fa-cb3e-4753-9aba-a78aa9a99836 --output assets/data/umami-live.json
      - name: Report unavailable visitor backup
        if: steps.visitors.outcome == 'failure'
        run: echo '::warning::Umami backup failed. The last verified lifetime totals and map remain available.'
      - name: Refresh Scholar snapshot
        id: scholar
        continue-on-error: true
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python scripts/update_scholar.py
      - name: Report unavailable metrics
        if: steps.scholar.outcome == 'failure'
        run: echo '::warning::Scholar refresh failed. Publishing the last verified snapshot with its original date.'
      - name: Preserve successful snapshots
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (steps.scholar.outcome == 'success' || steps.visitors.outcome == 'success')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/scholar.json assets/data/umami-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'Back up Umami aggregates and Scholar metrics'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Build the complete website
        run: python scripts/build_site.py
      - name: Validate pages and internal links
        run: python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
