name: Publish website and refresh Scholar metrics
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site builder
        run: python -m pip install -r scripts/requirements-site.txt
      - name: Validate Scholar updater
        run: python scripts/test_update_scholar.py
      - name: Refresh Scholar snapshot
        id: scholar
        continue-on-error: true
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python scripts/update_scholar.py
      - name: Report unavailable metrics
        if: steps.scholar.outcome == 'failure'
        run: echo '::warning::Scholar refresh failed. Publishing the last verified snapshot with its original date.'
      - name: Preserve successful snapshot
        if: steps.scholar.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/scholar.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Google Scholar metrics'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Build the complete website
        run: python scripts/build_site.py
      - name: Validate pages and internal links
        run: python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
