name: Test public WoS cloud reading

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wos-probe.yml'

permissions:
  contents: read

jobs:
  read-public-profile:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser package
        run: python -m pip install -r scripts/requirements-wos.txt
      - name: Install Chromium for cloud reading
        run: python -m playwright install --with-deps chromium
      - name: Validate count and failure handling
        run: python scripts/test_update_wos.py
      - name: Read the public profile without signing in
        timeout-minutes: 3
        run: python scripts/update_wos.py
      - name: Record the public aggregate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          snapshot = json.loads(Path('assets/data/wos.json').read_text(encoding='utf-8'))
          summary = f"Verified peer reviews: {snapshot['verified_peer_reviews']}\n\nChecked at: {snapshot['checked_at']}\n\nRead-only cloud test. No repository writes, site deployment, Google Scholar requests or SerpApi requests.\n"
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write(summary)
          PY

